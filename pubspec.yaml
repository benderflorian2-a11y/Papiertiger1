name: papiertiger
description: "Papiertiger – Keine Angst vor Post."
publish_to: 'none'
version: 1.29.0+32

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.0.7
  google_mlkit_text_recognition: '>=0.13.0 <1.0.0'
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2
  flutter_edge_ai: ^2.5.4
  flutter_edge_ai_litertlm: ^1.19.0
  pdfrx: ^2.11.0
  file_selector: ^1.1.0
  pdf: ^3.13.1
  share_plus: ^13.3.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFF8F0"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  remove_alpha_ios: true
