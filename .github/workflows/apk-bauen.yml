name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Papiertiger-Code finden
        run: |
          for z in *.zip; do [ -f "$z" ] && mkdir -p "entpackt/${z%.zip}" && unzip -o -q "$z" -d "entpackt/${z%.zip}"; done
          datei=$(find . -path '*lib/ui/home.dart' | sort | tail -1)
          if [ -z "$datei" ]; then
            echo "FEHLER: Papiertiger-Code nicht gefunden. Bitte die neueste papiertiger.zip hochladen."
            exit 1
          fi
          ordner=$(dirname "$(dirname "$(dirname "$datei")")")
          if [ "$ordner" != "." ]; then rm -rf lib test; cp -r "$ordner"/. .; fi
          echo "Code gefunden in: $ordner"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android- und iPhone-Dateien erzeugen
        run: |
          flutter create --project-name papiertiger --org de.papiertiger.app --platforms android,ios .
          sed -i 's/android:label="papiertiger"/android:label="Papiertiger"/' android/app/src/main/AndroidManifest.xml
          printf '%s\n' \
            '-dontwarn com.google.mlkit.vision.text.chinese.**' \
            '-dontwarn com.google.mlkit.vision.text.devanagari.**' \
            '-dontwarn com.google.mlkit.vision.text.japanese.**' \
            '-dontwarn com.google.mlkit.vision.text.korean.**' \
            >> android/app/proguard-rules.pro

      - name: Festen Test-Schluessel verwenden
        run: |
          mkdir -p ~/.android
          cp android-signing/debug.keystore ~/.android/debug.keystore

      - run: flutter pub get

      - name: App-Icon erzeugen
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Pruefung (Tests)
        continue-on-error: true
        run: flutter test

      - name: APK bauen
        run: |
          flutter build apk --release || {
            echo "Release-Bau fehlgeschlagen, baue Test-Version"
            flutter build apk --debug
          }

      - name: APK benennen
        run: |
          apk=$(ls build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-debug.apk 2>/dev/null | head -1)
          cp "$apk" papiertiger.apk
          ls -la papiertiger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: papiertiger-apk
          path: papiertiger.apk

      - name: Zum Download bereitstellen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Papiertiger Test ${{ github.run_number }}
          prerelease: false
          make_latest: true
          files: papiertiger.apk
