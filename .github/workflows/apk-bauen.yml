name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Papiertiger-Code finden
        run: |
          for z in *.zip; do [ -f "$z" ] && mkdir -p "entpackt/${z%.zip}" && unzip -o -q "$z" -d "entpackt/${z%.zip}"; done
          datei=$(find . -path '*lib/ui/home.dart' | sort | tail -1)
          if [ -z "$datei" ]; then
            echo "FEHLER: Papiertiger-Code nicht gefunden. Bitte die neueste papiertiger.zip hochladen."
            exit 1
          fi
          ordner=$(dirname "$(dirname "$(dirname "$datei")")")
          if [ "$ordner" != "." ]; then rm -rf lib test; cp -r "$ordner"/. .; fi
          echo "Code gefunden in: $ordner"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android- und iPhone-Dateien erzeugen
        run: |
          flutter create --project-name papiertiger --org de.papiertiger.tiger --platforms android,ios .
          rm -f test/widget_test.dart
          sed -i 's/android:label="papiertiger"/android:label="Papiertiger"/' android/app/src/main/AndroidManifest.xml
          printf '%s\n' \
            '-dontwarn com.google.mlkit.vision.text.chinese.**' \
            '-dontwarn com.google.mlkit.vision.text.devanagari.**' \
            '-dontwarn com.google.mlkit.vision.text.japanese.**' \
            '-dontwarn com.google.mlkit.vision.text.korean.**' \
            '-keep class com.google.mlkit.** { *; }' \
            '-keep class com.google.android.gms.internal.mlkit_vision_text_common.** { *; }' \
            '-keep class com.google.android.gms.internal.mlkit_vision_common.** { *; }' \
            '-keep class com.google_mlkit_text_recognition.** { *; }' \
            '-keep class com.google_mlkit_commons.** { *; }' \
            >> android/app/proguard-rules.pro
          # KI auf dem Handy braucht Android 11+ und Internet fuer den Modell-Download
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 30/' android/app/build.gradle.kts
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          # Geplante Benachrichtigungen: Desugaring und Empfaenger fuer Neustart
          python3 - <<'PY'
          import pathlib
          g = pathlib.Path('android/app/build.gradle.kts')
          s = g.read_text()
          s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
          s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n    implementation("androidx.core:core-ktx:1.13.1")\n}\n'
          g.write_text(s)
          m = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          x = m.read_text()
          x = x.replace('<application', '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n    <application', 1)
          # KI-Download als Vordergrund-Dienst: ab Android 14 Pflicht-Angaben, sonst Absturz beim Start
          if 'xmlns:tools' not in x:
              x = x.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android"', '<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"', 1)
          rechte = ''.join('<uses-permission android:name="android.permission.%s"/>\n    ' % r for r in [
              'ACCESS_NETWORK_STATE', 'FOREGROUND_SERVICE', 'FOREGROUND_SERVICE_DATA_SYNC', 'WAKE_LOCK', 'POST_NOTIFICATIONS'])
          x = x.replace('<application', rechte + '<application', 1)
          # Banking-App fuer die Freigabe oeffnen duerfen (Android 11+: Paket-Sichtbarkeit)
          x = x.replace('<application', '''<queries>
                  <package android:name="com.starfinanz.smob.android.sfinanzstatus" />
                  <package android:name="com.starfinanz.mobile.android.pushtan" />
              </queries>
              <application''', 1)
          x = x.replace('</application>', '''    <service android:name="androidx.work.impl.foreground.SystemForegroundService"
                      android:foregroundServiceType="dataSync" tools:node="merge" />
                  <provider android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.dateien"
                      android:exported="false" android:grantUriPermissions="true">
                      <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/papiertiger_dateien" />
                  </provider>
              </application>''', 1)
          # Startbildschirm-Widget
          x = x.replace('</application>', '''    <receiver android:name=".PapiertigerWidget" android:exported="false">
                      <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>
                      <meta-data android:name="android.appwidget.provider" android:resource="@xml/papiertiger_widget_info" />
                  </receiver>
              </application>''', 1)
          layout = pathlib.Path('android/app/src/main/res/layout')
          layout.mkdir(parents=True, exist_ok=True)
          (layout / 'papiertiger_widget.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widget_wurzel" android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:padding="12dp" android:background="#FFF8F0">
              <TextView android:id="@+id/widget_titel" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:textColor="#C9650F" android:textStyle="bold" android:textSize="15sp" android:maxLines="1" />
              <TextView android:id="@+id/widget_text" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:textColor="#2B2118" android:textSize="14sp" android:maxLines="5" android:layout_marginTop="4dp" />
          </LinearLayout>
          '''.replace('\n          ', '\n'))
          xmlw = pathlib.Path('android/app/src/main/res/xml')
          xmlw.mkdir(parents=True, exist_ok=True)
          (xmlw / 'papiertiger_widget_info.xml').write_text('<?xml version="1.0" encoding="utf-8"?>\n'
              '<appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android" '
              'android:minWidth="180dp" android:minHeight="110dp" android:updatePeriodMillis="3600000" '
              'android:initialLayout="@layout/papiertiger_widget" android:resizeMode="horizontal|vertical" '
              'android:widgetCategory="home_screen" />\n')
          xml = pathlib.Path('android/app/src/main/res/xml')
          xml.mkdir(parents=True, exist_ok=True)
          # Sicherheit: keine automatische Sicherung in die Google-Cloud und keine Uebertragung auf neue Geraete
          bereiche = ''.join('<exclude domain="%s" path="." />' % d for d in ['root', 'file', 'database', 'sharedpref', 'external'])
          (xml / 'papiertiger_sicherung_regeln.xml').write_text('<?xml version="1.0" encoding="utf-8"?>\n<data-extraction-rules>\n'
              '<cloud-backup>' + bereiche + '</cloud-backup>\n<device-transfer>' + bereiche + '</device-transfer>\n</data-extraction-rules>\n')
          x = x.replace('<application', '<application android:allowBackup="false" android:dataExtractionRules="@xml/papiertiger_sicherung_regeln" tools:replace="android:allowBackup"', 1)
          (xml / 'papiertiger_dateien.xml').write_text('<?xml version="1.0" encoding="utf-8"?>\n<paths>\n    <cache-path name="senden" path="senden/" />\n</paths>\n')
          empfaenger = '''
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
              </application>'''
          x = x.replace('</application>', empfaenger, 1)
          # Teilen -> Papiertiger: E-Mails, PDFs, Bilder und Text annehmen
          filter = '''
                  <intent-filter>
                      <action android:name="android.intent.action.SEND"/>
                      <category android:name="android.intent.category.DEFAULT"/>
                      <data android:mimeType="text/plain"/>
                      <data android:mimeType="application/pdf"/>
                      <data android:mimeType="message/rfc822"/>
                      <data android:mimeType="image/*"/>
                  </intent-filter>
                  <intent-filter>
                      <action android:name="android.intent.action.SEND_MULTIPLE"/>
                      <category android:name="android.intent.category.DEFAULT"/>
                      <data android:mimeType="image/*"/>
                      <data android:mimeType="application/pdf"/>
                  </intent-filter>
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW"/>
                      <category android:name="android.intent.category.DEFAULT"/>
                      <data android:scheme="content"/>
                      <data android:mimeType="application/pdf"/>
                      <data android:mimeType="message/rfc822"/>
                  </intent-filter>
              </activity>'''
          x = x.replace('</activity>', filter, 1)
          m.write_text(x)
          PY
          # Eigene MainActivity: Geteiltes empfangen, E-Mail/Telefon-Links oeffnen
          ziel=$(find android/app/src/main -name 'MainActivity.kt' | head -1)
          [ -n "$ziel" ] || { echo "MainActivity.kt nicht gefunden"; exit 1; }
          cp android-extra/MainActivity.kt "$ziel"
          cp android-extra/PapiertigerWidget.kt "$(dirname "$ziel")/PapiertigerWidget.kt"
          echo "MainActivity ersetzt: $ziel"
          grep -n "intent.action.SEND\|VIEW" android/app/src/main/AndroidManifest.xml
          grep -n "Desugaring\|desugar" android/app/build.gradle.kts
          grep -n "Receiver\|BOOT" android/app/src/main/AndroidManifest.xml
          grep -n "minSdk" android/app/build.gradle.kts
          grep -n "INTERNET" android/app/src/main/AndroidManifest.xml

      - name: Festen Test-Schluessel verwenden
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path('android/app/build.gradle.kts')
          s = p.read_text()
          block = '''    signingConfigs {
                  create("papiertiger") {
                      storeFile = file("../../android-signing/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }

              buildTypes {'''
          s = s.replace('    buildTypes {', block, 1)
          s = re.sub(r'signingConfig = signingConfigs\.getByName\("debug"\)',
                     'signingConfig = signingConfigs.getByName("papiertiger")', s)
          p.write_text(s)
          PY
          grep -n "papiertiger\|signingConfig" android/app/build.gradle.kts

      - name: Pakete laden
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee pub.txt

      - name: App-Icon erzeugen
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Pruefung (Tests)
        run: |
          set -o pipefail
          if flutter test 2>&1 | tee tests.txt; then echo "TESTS OK" > tests_status.txt; else echo "TESTS FEHLGESCHLAGEN" > tests_status.txt; fi
          cat tests_status.txt

      - name: Rundgang-Bilder packen
        if: always()
        continue-on-error: true
        run: |
          if [ -d build/rundgang ]; then
            (command -v pdftoppm >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)) >/dev/null 2>&1 || true
            for f in build/rundgang/*.pdf; do [ -f "$f" ] && pdftoppm -png -r 70 "$f" "${f%.pdf}_seite" || true; done
            (cd build && zip -q -r ../rundgang.zip rundgang)
          fi
          ls -la rundgang.zip || echo "kein Rundgang" > rundgang_fehlt.txt

      - name: E-Rechnung pruefen (KoSIT-Validator)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p kosit && cd kosit
          {
            gh release list -R itplr-kosit/validator -L 3
            gh release view -R itplr-kosit/validator --json assets -q '.assets[].name'
            gh release list -R itplr-kosit/validator-configuration-xrechnung -L 3
            gh release view -R itplr-kosit/validator-configuration-xrechnung --json assets -q '.assets[].name'
          } > ../kosit_liste.txt 2>&1 || true
          gh release download -R itplr-kosit/validator -p '*.zip' >> ../kosit_liste.txt 2>&1 || true
          gh release download -R itplr-kosit/validator -p '*.jar' >> ../kosit_liste.txt 2>&1 || true
          gh release download -R itplr-kosit/validator-configuration-xrechnung -p '*.zip' >> ../kosit_liste.txt 2>&1 || true
          for z in *.zip; do unzip -o -q "$z"; done
          find . -maxdepth 3 \( -name '*.jar' -o -name 'scenarios.xml' \) >> ../kosit_liste.txt
          ls ../build/erechnung_*.xml >> ../kosit_liste.txt 2>&1
          jar=$(find . -name '*standalone*.jar' | head -1)
          [ -z "$jar" ] && jar=$(find . -name 'validat*.jar' | head -1)
          szen=$(find . -name 'scenarios.xml' | head -1)
          echo "Validator: $jar / $szen" > ../erechnung.txt
          java -jar "$jar" -s "$(realpath "$szen")" -r "$(realpath "$(dirname "$szen")")" -o ergebnis ../build/erechnung_*.xml >> ../erechnung.txt 2>&1 || true
          for f in ergebnis/*.xml; do
            echo "== $f" >> ../erechnung.txt
            grep -o 'valid="[a-z]*"' "$f" | head -1 >> ../erechnung.txt
            grep -o '<svrl:failed-assert[^>]*>' "$f" | grep -o 'id="[^"]*"' | head -20 >> ../erechnung.txt
            grep -o '<svrl:text>[^<]*' "$f" | head -20 >> ../erechnung.txt
          done
          cat ../erechnung.txt

      - name: APK bauen
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee build.txt

      - name: APK benennen und Schluessel pruefen
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk papiertiger.apk
          ls -la papiertiger.apk
          signer=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $signer verify --print-certs papiertiger.apk | tee certs.txt
          grep -qi "76730f6c8b9e443702d1d639e78729a39623012adda7e7d9201db667963c2754" certs.txt || {
            echo "FEHLER: APK ist nicht mit dem festen Papiertiger-Schluessel signiert"; exit 1; }

      - name: Bericht schreiben
        if: always()
        run: |
          {
            echo "## Tests"
            cat tests_status.txt 2>/dev/null || echo "nicht gelaufen"
            echo '```'
            grep -n -A 25 -E "❌|\[E\]|Some tests failed|Error:|error:" tests.txt 2>/dev/null | head -n 80
            echo '---'
            tail -n 60 tests.txt 2>/dev/null | grep -v '^\s*$' | tail -n 20
            echo '```'
            echo "## Rundgang"
            echo '```'
            cat build/rundgang/fehler.txt build/rundgang/pdf_fehler.txt 2>/dev/null | head -n 60
            echo '```'
            echo "## E-Rechnung (KoSIT)"
            echo '```'
            grep -v "^\./libs/" kosit_liste.txt 2>/dev/null | tail -n 6
            grep -iE "valid=|accept|reject|id=|svrl:text|==|Validator|error|exception" erechnung.txt 2>/dev/null | head -n 60
            echo '```'
            echo "## Bau"
            echo '```'
            grep -iE "error|fehler|exception|failed|warning: \[" build.txt pub.txt 2>/dev/null | head -n 60
            tail -n 40 build.txt 2>/dev/null
            echo '```'
          } > bericht.md
          cut -c1-60000 bericht.md > bericht_kurz.md

      - uses: actions/upload-artifact@v4
        with:
          name: papiertiger-apk
          path: papiertiger.apk

      - name: Zum Download bereitstellen
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Papiertiger Test ${{ github.run_number }}
          prerelease: false
          make_latest: true
          body_path: bericht_kurz.md
          files: |
            papiertiger.apk
            rundgang.zip

      - name: Fehlerbericht veroeffentlichen
        if: failure() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fehler-${{ github.run_number }}
          name: Fehlerbericht ${{ github.run_number }}
          prerelease: true
          make_latest: false
          body_path: bericht_kurz.md
