name: Paket ansehen

# Hilfsablauf: lädt den Quelltext eines Dart-Pakets und legt ihn als Vorabversion ab (zum Nachlesen der Schnittstelle).
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paket-ansehen.yml'

permissions:
  contents: write

jobs:
  ansehen:
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Paket holen
        run: |
          dart create -t console tmp_paket && cd tmp_paket
          dart pub add fints
          ordner=$(find ~/.pub-cache/hosted/pub.dev -maxdepth 1 -type d -name 'fints-*' | head -1)
          echo "$ordner"
          tar czf ../fints-quelle.tar.gz -C "$(dirname "$ordner")" "$(basename "$ordner")"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: paket-fints-${{ github.run_number }}
          name: Paketquelle fints ${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: Quelltext des Pakets fints zum Nachlesen der Schnittstelle.
          files: fints-quelle.tar.gz
