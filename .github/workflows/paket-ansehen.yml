name: Paket ansehen

# Hilfsablauf: lädt den Quelltext eines Dart-Pakets und legt ihn als Vorabversion ab (zum Nachlesen der Schnittstelle).
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/paket-ansehen.yml'

permissions:
  contents: write

jobs:
  ansehen:
    runs-on: ubuntu-latest
    steps:
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Paket holen
        run: |
          flutter create --platforms android tmp_paket && cd tmp_paket
          flutter pub add 'google_mlkit_text_recognition:>=0.13.0 <1.0.0' google_mlkit_document_scanner fints
          grep -A2 "google_mlkit\|fints" pubspec.lock | head -40
          cd ~/.pub-cache/hosted/pub.dev && ls && tar czf $GITHUB_WORKSPACE/fints-quelle.tar.gz $(ls -d fints-* google_mlkit_document_scanner-* google_mlkit_commons-* 2>/dev/null)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: paket-fints-${{ github.run_number }}
          name: Paketquelle fints ${{ github.run_number }}
          prerelease: true
          make_latest: false
          body: Quelltext des Pakets fints zum Nachlesen der Schnittstelle.
          files: ${{ github.workspace }}/fints-quelle.tar.gz
