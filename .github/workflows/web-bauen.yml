name: Browser bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Browser-Projekt erzeugen
        run: |
          flutter create --project-name papiertiger --org de.papiertiger.tiger --platforms web .
          rm -f test/widget_test.dart
          sed -i 's#<title>.*</title>#<title>Papiertiger</title>#' web/index.html
          sed -i 's#"name": "papiertiger"#"name": "Papiertiger"#; s#"short_name": "papiertiger"#"short_name": "Papiertiger"#' web/manifest.json
          sed -i 's#A new Flutter project.#Briefe verstehen, Rechnungen schreiben, Finanzen im Blick.#' web/index.html web/manifest.json
          sed -i 's#content="papiertiger"#content="Papiertiger"#' web/index.html
          sed -i 's#</title>#</title>\n  <style>html,body{margin:0;background:\#FFF8F0;}</style>#' web/index.html

      - name: Pakete laden
        run: flutter pub get

      - name: App-Icon erzeugen
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Bauen
        run: |
          set -o pipefail
          # Alles lokal (keine Schriften/CanvasKit von fremden Servern), kein Service Worker
          if flutter build web --release --no-web-resources-cdn --pwa-strategy=none 2>&1 | tee bau.txt; then
            echo "WEB OK" > status.txt
            # Relativ, damit die Seite auch in einem Unterordner läuft
            sed -i 's#<base href="/">#<base href="./">#' build/web/index.html
            (cd build/web && zip -q -r ../../papiertiger-web.zip .)
            ls -la papiertiger-web.zip
          else
            echo "WEB FEHLER" > status.txt
          fi

      - name: Bericht
        if: always()
        run: |
          {
            echo "## Browser"
            cat status.txt 2>/dev/null || echo "nicht gelaufen"
            echo '```'
            grep -iE "error|fehler|failed" bau.txt 2>/dev/null | head -n 80
            tail -n 25 bau.txt 2>/dev/null
            echo '```'
          } > bericht_web.md
          cut -c1-60000 bericht_web.md > bericht_web_kurz.md

      - name: Ergebnis veröffentlichen
        if: always() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: web-${{ github.run_number }}
          name: Browser-Build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          body_path: bericht_web_kurz.md
          files: papiertiger-web.zip
