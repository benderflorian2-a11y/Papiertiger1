name: Bank-Adresse suchen

# Hilfsablauf: exportiert die Bankenliste (Bankleitzahl, Name, FinTS-Adresse) als JSON-Datei.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  suchen:
    runs-on: ubuntu-latest
    steps:
      - name: Bankenliste exportieren
        run: |
          pip install fints-url 2>&1 | tail -1
          python3 - <<'PY'
          import fints_url, json
          info = fints_url.__bank_info__
          print("Eintraege:", len(info))
          k = next(iter(info)); print("Beispiel:", k, info[k])
          print("Siegen:", info.get("46050001"))
          json.dump(info, open("bank_roh.json", "w"), ensure_ascii=False, default=str)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: bankdaten-${{ github.run_number }}
          name: Bankdaten ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: bank_roh.json
