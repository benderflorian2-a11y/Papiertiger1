name: Bank-Adresse suchen

# Hilfsablauf: schaut sich die Datenquelle der Bank-Adressen an.
on:
  workflow_dispatch:

jobs:
  suchen:
    runs-on: ubuntu-latest
    steps:
      - name: fints-url Daten ansehen
        run: |
          pip install fints-url 2>&1 | tail -1
          d=$(python3 -c "import fints_url,os;print(os.path.dirname(fints_url.__file__))")
          echo "== Dateien"; ls -la $d $d/* | head -40
          echo "== Quelle"; sed -n 1,60p $d/__init__.py
